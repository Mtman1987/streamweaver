app = 'streamweaver-new'
primary_region = 'iad'

[build]
  [build.args]
    NEXT_PUBLIC_TWITCH_CLIENT_ID = '9u0mtc83xeabmguw53c89dehth0gwg'
    NEXT_PUBLIC_STREAMWEAVE_WS_URL = 'wss://streamweaver-new.fly.dev:8090'
    NEXT_PUBLIC_BASE_URL = 'https://streamweaver-new.fly.dev'
    NEXT_PUBLIC_STREAMWEAVE_URL = 'https://streamweaver-new.fly.dev'

[env]
  PERSIST_ROOT = '/data/runtime'
  APP_URL = 'https://streamweaver-new.fly.dev'
  INTERNAL_API_BASE_URL = 'https://streamweaver-new.fly.dev'

[[mounts]]
  source = 'streamweaver_data'
  destination = '/data'
  initial_size = '20gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health'

[[services]]
  internal_port = 8090
  protocol = 'tcp'
  auto_stop_machines = 'off'

  [[services.ports]]
    port = 8090
    handlers = ['tls']

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
