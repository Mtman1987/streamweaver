name: Verify Gemini credential presence and unchanged host
on:
  push:
    branches: [fix/free-ai-readiness-20261006]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == 'Mtman1987'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify shared CPU resources and health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machines list --app streamweaver-new --json > "$RUNNER_TEMP/machines.json"
          python3 - "$RUNNER_TEMP/machines.json" <<'PY'
          import json,sys
          machines=json.load(open(sys.argv[1]))
          assert len(machines)==1
          for m in machines:
              g=m['config']['guest']
              assert g['cpu_kind']=='shared' and g['cpus']==2 and g['memory_mb']==2048
              checks=m.get('checks',[])
              print(json.dumps({'machine_count':len(machines),'shared_cpu':1,'cpus':g['cpus'],'ram_mb':g['memory_mb'],'started':int(m['state']=='started'),'passing_checks':sum(c.get('status')=='passing' for c in checks),'failing_checks':sum(c.get('status') in ['critical','warning'] for c in checks)}))
          PY
      - name: Verify runtime credential presence and free policy without displaying secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
