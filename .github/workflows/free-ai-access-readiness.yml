name: Gemini access diagnosis
on:
  push:
    branches: [fix/free-ai-readiness-20261006]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check key access without generating text
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console --app streamweaver-new --quiet --command 'node -e "eval(Buffer.from(\"\",\"base64\").toString(\"utf8\"))"'
