name: Apply staged Gemini credential and verify host
on:
  push:
    branches: [fix/free-ai-readiness-20261006]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == 'Mtman1987'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Apply staged credential without changing machine resources
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl secrets deploy --app streamweaver-new
      - name: Verify shared CPU resources and health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machines list --app streamweaver-new --json > "$RUNNER_TEMP/machines.json"
          python3 - "$RUNNER_TEMP/machines.json" <<'PY'
          import json,sys
          machines=json.load(open(sys.argv[1]))
          assert len(machines)==1
          for m in machines:
              g=m['config']['guest']
              assert g['cpu_kind']=='shared' and g['cpus']==2 and g['memory_mb']==2048
              checks=m.get('checks',[])
              print(json.dumps({'machine_count':len(machines),'shared_cpu':1,'cpus':g['cpus'],'ram_mb':g['memory_mb'],'started':int(m['state']=='started'),'passing_checks':sum(c.get('status')=='passing' for c in checks),'failing_checks':sum(c.get('status') in ['critical','warning'] for c in checks)}))
          PY
      - name: Verify runtime credential presence and free policy without displaying secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console --app streamweaver-new --command '/opt/kokoro-venv/bin/python -c "import os,json,pathlib; p=pathlib.Path('/app/config/ai-cost-policy.json'); policy=json.loads(p.read_text()) if p.exists() else {}; mem={k:int(v.split()[0]) for k,v in (l.split(':',1) for l in pathlib.Path('/proc/meminfo').read_text().splitlines())}; print(json.dumps({'gemini_key_present':int(bool(os.environ.get('GEMINI_API_KEY'))),'gemini_free_tier_verified':int(policy.get('geminiFreeTierVerified') is True),'paid_routes_enabled':int(policy.get('paidRoutesEnabled') is True),'ram_total_kib':mem['MemTotal'],'ram_available_kib':mem['MemAvailable']}))"'
