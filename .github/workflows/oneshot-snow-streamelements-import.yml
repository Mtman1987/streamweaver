name: One-time Snow StreamElements import
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneshot-snow-streamelements-import.yml"
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Run existing Snow import endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"tenantId":"428161033","username":"the_lovely_princess_snow"}' \
            'https://streamweaver-new.fly.dev/api/streamelements/import' \
            | tee snow-import-response.json
      - name: Preserve response as artifact
        uses: actions/upload-artifact@v4
        with:
          name: snow-streamelements-import-response
          path: snow-import-response.json
          retention-days: 3
