name: Recover StreamWeaver player and runtime data (encrypted export)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-persistent-volume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-player-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Export persistent state in size-bounded encrypted bundles
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "No Fly API token is configured in repository Actions secrets."
            exit 1
          fi
          cat > /tmp/export-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsy8quWVueuds6mXw2Lxd
          m2CQlIlZuvll0Stp4+rUvfM/55cAe1Aqs9yASbYL5VhhyDy8VOxaT4Xrz5hhkJsW
          Vn9+v+fz1hNjQt1BYo39LswVqWfGvALtC20AmwLHF7+QgvgEG/pLH2L1jDjSIjCB
          R7PQFsRa1h+OLqhv4IVK6nOxcmpZ0iytcO7Ryupi+vyOIOqKRwY5oP/ZH6SV8aus
          2pmxAOJHDjKgnM8e7CJu8OuwIposxu9sp0ng4jnlOoQx8EKZ58exz5vdqxur0E6b
          xmfTLhQq1gjmpeZieyv2eO/0qXKM1EN8nrVVayJu536MGFoMbDVQmAg4SzVobK/K
          HhvG+WZxgwvS9MMkvZNUWhS4L87LQ6I7loApVjN/sSPBwl1lVPH5z/NdCledLlT9
          M+3NFx1rDnhTEh3t9KVHysmlrRhPmhUzSPDmq5gsyoCeA1wqVlcAewnIsCJvn6HS
          AUesZ6Sja8yAzbzWz/RKzXGhUO9pFGogOlokNyrGiY2rAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY
          echo "Exporting player/runtime state without large Pokedex HTML pages..."
          timeout 240s flyctl ssh console --app streamweaver-new -C "sh -c 'tar --exclude=runtime/global/pokedex -cf /tmp/streamweaver-state.tar -C /data runtime/data runtime/global runtime/streamweaver-main/data runtime/commands runtime/actions runtime/config runtime/tokens runtime/tenants data global commands actions config tokens tenants && gzip -1 -c /tmp/streamweaver-state.tar | base64'" > /tmp/streamweaver-state.b64
          base64 -d /tmp/streamweaver-state.b64 > /tmp/streamweaver-state.tar.gz
          tar -tzf /tmp/streamweaver-state.tar.gz > /tmp/streamweaver-state-list.txt
          echo "State archive files: $(wc -l < /tmp/streamweaver-state-list.txt); bytes: $(wc -c < /tmp/streamweaver-state.tar.gz)"
          openssl rand -hex 32 > /tmp/state-password
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/streamweaver-state.tar.gz -out /tmp/streamweaver-state.tar.gz.enc -pass file:/tmp/state-password
          openssl pkeyutl -encrypt -pubin -inkey /tmp/export-public.pem -in /tmp/state-password -out /tmp/streamweaver-state.key.enc
          rm -f /tmp/streamweaver-state.b64 /tmp/streamweaver-state.tar.gz /tmp/state-password
          echo "Exporting Pokedex HTML pages as a separate bundle..."
          timeout 240s flyctl ssh console --app streamweaver-new -C "sh -c 'tar -cf /tmp/streamweaver-pokedex.tar -C /data runtime/global/pokedex && gzip -1 -c /tmp/streamweaver-pokedex.tar | base64'" > /tmp/streamweaver-pokedex.b64
          base64 -d /tmp/streamweaver-pokedex.b64 > /tmp/streamweaver-pokedex.tar.gz
          tar -tzf /tmp/streamweaver-pokedex.tar.gz > /tmp/streamweaver-pokedex-list.txt
          echo "Pokedex archive files: $(wc -l < /tmp/streamweaver-pokedex-list.txt); bytes: $(wc -c < /tmp/streamweaver-pokedex.tar.gz)"
          openssl rand -hex 32 > /tmp/pokedex-password
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/streamweaver-pokedex.tar.gz -out /tmp/streamweaver-pokedex.tar.gz.enc -pass file:/tmp/pokedex-password
          openssl pkeyutl -encrypt -pubin -inkey /tmp/export-public.pem -in /tmp/pokedex-password -out /tmp/streamweaver-pokedex.key.enc
          rm -f /tmp/streamweaver-pokedex.b64 /tmp/streamweaver-pokedex.tar.gz /tmp/pokedex-password
          echo "Both export bundles are encrypted before artifact upload."
      - name: Upload encrypted player/runtime state (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: streamweaver-state-encrypted
          path: |
            /tmp/streamweaver-state.tar.gz.enc
            /tmp/streamweaver-state.key.enc
          retention-days: 1
          if-no-files-found: error
      - name: Upload encrypted Pokedex pages (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: streamweaver-pokedex-encrypted
          path: |
            /tmp/streamweaver-pokedex.tar.gz.enc
            /tmp/streamweaver-pokedex.key.enc
          retention-days: 1
          if-no-files-found: error
