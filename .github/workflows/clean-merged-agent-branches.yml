name: Clean merged agent branches

on:
  pull_request:
    types:
      - closed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clean-merged-agent-branches.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete unchanged branches from merged agent PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const candidates = new Map();

            const remember = (pull) => {
              if (!pull.merged_at) return;
              if (pull.head.repo?.full_name !== `${owner}/${repo}`) return;
              if (!pull.head.ref.startsWith('agent/')) return;
              candidates.set(pull.head.ref, pull.head.sha);
            };

            if (context.eventName === 'pull_request') {
              remember(context.payload.pull_request);
            } else {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'closed',
                per_page: 100,
              });
              for (const pull of pulls) remember(pull);
            }

            for (const [branch, mergedHeadSha] of candidates) {
              let current;
              try {
                current = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }

              if (current.data.object.sha !== mergedHeadSha) {
                core.info(`Keeping ${branch}: it has commits newer than the merged PR.`);
                continue;
              }

              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted merged branch ${branch}.`);
            }

