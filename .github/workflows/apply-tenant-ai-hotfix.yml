name: Apply tenant AI hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-tenant-ai-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch tenant AI routing and diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          client_path = Path('src/services/twitch-client.ts')
          text = client_path.read_text()
          old = """  const channelName = channel.replace('#', '').toLowerCase();\n  const msgTenantId = channelToTenant.get(channelName) || fallbackTenantId;\n"""
          new = """  const channelName = channel.replace('#', '').toLowerCase();\n  const msgTenantId = resolveIncomingTenantId(channel, fallbackTenantId);\n"""
          if old not in text:
              raise SystemExit('twitch-client tenant resolution anchor not found')
          text = text.replace(old, new, 1)

          anchor = """export function shouldDispatchIncomingFromCommunityBot(broadcasterClient: tmi.Client | null | undefined): boolean {\n  return !isClientUsable(broadcasterClient);\n}\n"""
          helper = """export function resolveIncomingTenantId(channel: string, fallbackTenantId?: string): string | undefined {\n  const channelName = channel.replace(/^#/, '').toLowerCase();\n  return channelToTenant.get(channelName) || fallbackTenantId;\n}\n\n"""
          if anchor not in text:
              raise SystemExit('twitch-client helper anchor not found')
          text = text.replace(anchor, helper + anchor, 1)

          mirror_anchor = """  let effectiveChannel = channel;\n  const isMirrored = isMirroredSharedMessage(tags);\n  if (isMirrored) {\n"""
          mirror_new = """  let effectiveChannel = channel;\n  const isMirrored = isMirroredSharedMessage(tags);\n\n  // The IRC listener already knows which tenant owns a direct channel. If the\n  // reverse map is temporarily missing or stale, preserve that trusted tenant\n  // context before the dispatcher tries to resolve the channel again. Never\n  // learn mappings from mirrored shared-chat events because their effective\n  // source channel can belong to a different broadcaster.\n  if (!isMirrored && msgTenantId && !channelToTenant.has(channelName)) {\n    channelToTenant.set(channelName, msgTenantId);\n    console.warn(`[Twitch:${msgTenantId}] Healed missing channel tenant mapping for #${channelName} from listener context.`);\n  }\n\n  if (isMirrored) {\n"""
          if mirror_anchor not in text:
              raise SystemExit('twitch-client mirrored anchor not found')
          text = text.replace(mirror_anchor, mirror_new, 1)
          client_path.write_text(text)

          test_path = Path('tests/twitch-client.test.ts')
          test_text = test_path.read_text()
          old_import = "import { shouldDispatchIncomingFromCommunityBot } from '../src/services/twitch-client';"
          new_import = "import { resolveIncomingTenantId, shouldDispatchIncomingFromCommunityBot } from '../src/services/twitch-client';"
          if old_import not in test_text:
              raise SystemExit('twitch-client test import anchor not found')
          test_text = test_text.replace(old_import, new_import, 1)
          test_text += """\n\ntest('listener tenant fallback survives a missing channel mapping', () => {\n  assert.equal(resolveIncomingTenantId('#unmapped-tenant-channel', 'tenant-123'), 'tenant-123');\n});\n"""
          test_path.write_text(test_text)

          dispatcher_path = Path('src/services/chat-dispatcher.ts')
          dispatcher = dispatcher_path.read_text()
          old_send = "await sendChatMessage(aiReply, 'bot', responseChannel, responseTenantId).catch(() => {});"
          new_send = """await sendChatMessage(aiReply, 'bot', responseChannel, responseTenantId).catch((error) => {\n                                    console.error('[Dispatcher] AI Twitch reply send failed:', {\n                                        sourceChannel: replyChannel,\n                                        tenantId,\n                                        responseTenantId,\n                                        responseChannel,\n                                        botName: responseBotName,\n                                        error: error instanceof Error ? error.message : String(error),\n                                    });\n                                });"""
          count = dispatcher.count(old_send)
          if count < 2:
              raise SystemExit(f'expected at least 2 silent AI send sites, found {count}')
          dispatcher = dispatcher.replace(old_send, new_send)
          dispatcher_path.write_text(dispatcher)

          mappings_path = Path('public/twitch-mappings.json')
          data = json.loads(mappings_path.read_text())
          not_found = data.get('notFound')
          if isinstance(not_found, list):
              data['notFound'] = [item for item in not_found if str(item).lower() != 'nephalem2']
              mappings_path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          npm install --include=dev --no-audit --no-fund
          node --import tsx --test tests/twitch-client.test.ts
          npx tsc --noEmit --incremental false

      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-tenant-ai-hotfix.yml
          git config user.name "Athena Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/services/twitch-client.ts src/services/chat-dispatcher.ts tests/twitch-client.test.ts public/twitch-mappings.json
          git commit -m "Fix tenant AI replies in Twitch chat"
          git push origin HEAD:main

# one-shot trigger refresh
