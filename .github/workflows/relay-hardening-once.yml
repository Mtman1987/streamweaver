name: Relay hardening once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/relay-hardening-once.yml
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch relay routing
        run: python3 scripts/patch-relay-hardening.py
      - name: Typecheck
        run: npm run typecheck
      - name: Commit hardened relay routing
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/chat-dispatcher.ts
          git diff --cached --check
          git commit -m "Harden relay destination routing"
          git push origin HEAD:main
