name: One-time stale branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-stale-branch-cleanup.yml
permissions:
  contents: write
jobs:
  archive-and-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive branches not contained in main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p REVIEW_BEFORE_DELETE/remote-branches
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          : > REVIEW_BEFORE_DELETE/remote-branches/MANIFEST.tsv
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "main" ] && continue
            [ "$branch" = "HEAD" ] && continue
            ahead="$(git rev-list --count "origin/main..${ref}")"
            behind="$(git rev-list --count "${ref}..origin/main")"
            safe="$(printf '%s' "$branch" | sed 's#[^A-Za-z0-9._-]#_#g')"
            printf '%s\t%s\t%s\t%s\n' "$branch" "$ahead" "$behind" "$(git rev-parse "$ref")" >> REVIEW_BEFORE_DELETE/remote-branches/MANIFEST.tsv
            if [ "$ahead" -gt 0 ]; then
              git diff --binary "origin/main...${ref}" > "REVIEW_BEFORE_DELETE/remote-branches/${safe}.patch"
              git log --reverse --date=iso --pretty='format:%H%x09%ad%x09%s' "origin/main..${ref}" > "REVIEW_BEFORE_DELETE/remote-branches/${safe}.commits.tsv"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
      - name: Delete non-main remote branches
        shell: bash
        run: |
          set -uo pipefail
          : > REVIEW_BEFORE_DELETE/remote-branches/DELETION_RESULTS.tsv
          while IFS=$'\t' read -r branch ahead behind sha; do
            if git push origin --delete "$branch"; then
              printf '%s\tdeleted\n' "$branch" >> REVIEW_BEFORE_DELETE/remote-branches/DELETION_RESULTS.tsv
            else
              printf '%s\tretained-delete-failed\n' "$branch" >> REVIEW_BEFORE_DELETE/remote-branches/DELETION_RESULTS.tsv
            fi
          done < REVIEW_BEFORE_DELETE/remote-branches/MANIFEST.tsv
      - name: Upload review archive
        uses: actions/upload-artifact@v4
        with:
          name: review-before-delete-${{ github.event.repository.name }}-${{ github.run_id }}
          path: REVIEW_BEFORE_DELETE
          if-no-files-found: error
          retention-days: 30
