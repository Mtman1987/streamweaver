name: Verify both Athena speech routes
on:
  push:
    branches: [codex/athena-direct-key]
    paths: [.github/workflows/athena-key-install.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Apply the Deepgram secret already staged in Fly
        run: flyctl secrets deploy --app streamweaver-new
      - name: Install audio decoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify direct Athena and forced same-voice failover
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app streamweaver-new --command 'node --import tsx -e '\''const {generateTTS,getTTSConfig}=require("./src/services/tts-provider.ts");
          (async()=>{
           const config=getTTSConfig("94371378");
           if(config.voice!=="deepgram:aura-2:athena"||!config.deepgramApiKey||!config.apiKey)throw new Error("Expected both providers with canonical Athena");
           const originalFetch=globalThis.fetch;
           let mode="direct",route="";
           globalThis.fetch=async(...args)=>{
            const url=String(args[0]);
            if(url.startsWith("https://api.deepgram.com/v1/speak")){
             if(!url.endsWith("model=aura-2-athena-en"))throw new Error("Direct voice changed");
             if(mode==="fallback")return new Response(null,{status:402});
             route="direct-deepgram";
            }else if(url==="https://api.edenai.run/v3/universal-ai"){
             const body=JSON.parse(args[1].body);
             if(body.model!=="audio/tts/deepgram/aura-2"||body.input.voice!=="aura-2-athena-en")throw new Error("Fallback voice changed");
             route="edenai-deepgram";
            }
            return originalFetch(...args);
           };
           for(const check of ["direct","fallback"]){
            mode=check;route="";
            const audio=await generateTTS("This is an Athena voice check.",undefined,"94371378");
            if(route!==(mode==="direct"?"direct-deepgram":"edenai-deepgram"))throw new Error("Unexpected speech route");
            if(!audio.startsWith("data:audio/mpeg;base64,"))throw new Error("Expected MP3");
            console.log("ATHENA_CHECK:"+JSON.stringify({mode,route,voice:"aura-2-athena-en",audio:audio.split(",")[1]}));
           }
          })().catch(e=>{console.error("Athena check failed: "+e.message);process.exitCode=1});'\''' | python3 -c 'import sys,json,base64,subprocess,array,math
          seen=set()
          for line in sys.stdin:
           if not line.startswith("ATHENA_CHECK:"): continue
           d=json.loads(line.split(":",1)[1]); audio=base64.b64decode(d.pop("audio"),validate=True)
           r=subprocess.run(["ffmpeg","-v","error","-i","pipe:0","-ac","1","-ar","16000","-f","s16le","pipe:1"],input=audio,capture_output=True)
           assert r.returncode==0,"MP3 decoding failed"
           samples=array.array("h"); samples.frombytes(r.stdout)
           assert len(samples)>1600,"Audio too short"
           rms=math.sqrt(sum((v/32768)**2 for v in samples)/len(samples))
           assert rms>0.001,"Audio is silent"
           seen.add(d["mode"]);d.update(decoded=True,seconds=round(len(samples)/16000,3),rms=round(rms,4))
           print(json.dumps(d),flush=True)
          assert seen=={"direct","fallback"},"Both voice routes must pass"
          '
