name: Configure direct Athena speech
on:
  push:
    branches: [codex/athena-direct-key]
    paths: [.github/workflows/athena-key-install.yml]
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Remove unused temporary transfer key
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app streamweaver-new --command 'node -e '\''require("fs").rmSync("/data/runtime/.athena-key-install-20260906.pem",{force:true});console.log("Temporary transfer key removed; no application credentials changed.");'\'''
