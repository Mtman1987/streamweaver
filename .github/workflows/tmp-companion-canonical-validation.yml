name: Temporary Companion canonical validation

on:
  push:
    branches:
      - fix/companion-canonical-surfaces

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - run: npm run check
