name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            for (const branch of branches) {
              if (branch.name === "main") continue;
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`,
              });
              core.info(`Deleted ${branch.name}`);
            }

      - name: Remove this one-time workflow
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = ".github/workflows/one-time-branch-cleanup.yml";
            const file = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: "main",
            });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              message: "Remove completed one-time branch cleanup",
              sha: file.data.sha,
              branch: "main",
            });
