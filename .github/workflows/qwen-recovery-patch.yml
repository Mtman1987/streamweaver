name: Qwen Recovery Patch Runner

on:
  push:
    branches:
      - fix/qwen-repetition-recovery-model-ui

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message != 'Apply Qwen recovery patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/qwen-repetition-recovery-model-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Qwen recovery patch
        run: node scripts/patch-qwen-repetition-recovery.mjs
      - name: Run focused Qwen tests
        run: node --import tsx --test tests/private-chat-qwen-mode.test.ts tests/qwen-quality.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/qwen-private-chat.ts
          if git diff --cached --quiet; then
            echo "No generated source changes."
          else
            git commit -m "Apply Qwen recovery patch"
            git push origin HEAD:fix/qwen-repetition-recovery-model-ui
          fi
