name: Relay history attachment once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/relay-history-attachment-once.yml
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/patch-relay-history-attachment.py
      - name: Validate touched relay code
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          grep 'error TS' /tmp/typecheck.log | grep -v 'src/services/signal-carrier-sync.ts(2,10): error TS2305' > /tmp/new-errors.log || true
          if [ -s /tmp/new-errors.log ]; then cat /tmp/new-errors.log; exit 1; fi
          if [ "$status" -ne 0 ]; then echo 'Only the known signal-carrier-sync TS2305 remains.'; fi
      - name: Commit compact relay history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/discord-local.ts src/services/discord-structured-replies.ts src/services/chat-dispatcher.ts
          git diff --cached --check
          git commit -m "Keep relay cards compact with history attachment"
          git push origin HEAD:main
