name: Athena private validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/ai/chat-with-memory/**'
      - 'src/app/api/athena/**'
      - 'src/app/api/private-chat/**'
      - 'src/services/athena-*.ts'
      - 'src/services/backstage-lore.ts'
      - 'src/services/explicit-bot-relay.ts'
      - 'src/services/private-chat-ai.ts'
      - 'src/services/shared-chat-ingestion.ts'
      - 'src/lib/bot-interactions-store.ts'
      - 'src/lib/bot-settings-store.ts'
      - 'src/lib/internal-service-auth.ts'
      - 'src/lib/spmt-userinfo.ts'
      - 'src/lib/world-lore-store.ts'
      - 'src/data/world-lore-default.json'
      - 'data/runtime/global/world-lore.json'
      - 'tests/athena-*.test.ts'
      - 'tests/backstage-lore.test.ts'
      - 'tests/explicit-bot-relay.test.ts'
      - 'tests/private-chat-ai.test.ts'
      - 'tests/spmt-userinfo.test.ts'
      - 'docs/ATHENA_OS_PRIVATE_VERTICAL_SLICE.md'
      - '.github/workflows/athena-private-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Athena focused tests
        run: >-
          node --import tsx --test --test-force-exit
          tests/athena-contract.test.ts
          tests/athena-group-memory.test.ts
          tests/athena-group-memory-execution.test.ts
          tests/athena-memory-boundary.test.ts
          tests/athena-model.test.ts
          tests/athena-oauth-route.test.ts
          tests/athena-tenant-persona.test.ts
          tests/athena-tools.test.ts
          tests/backstage-lore.test.ts
          tests/explicit-bot-relay.test.ts
          tests/private-chat-ai.test.ts
          tests/spmt-userinfo.test.ts
