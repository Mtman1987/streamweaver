name: One-shot OpenAI Qwen fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-openai-qwen-fallback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add OpenAI fallback service
        run: |
          cat > src/services/openai-fallback.ts <<'EOF'
          export type OpenAiFallbackMessage = { role: 'user' | 'assistant'; content: string };
          export type OpenAiFallbackOptions = { maxTokens?: number; temperature?: number; model?: string };

          function extractOutputText(payload: any): string {
            if (typeof payload?.output_text === 'string' && payload.output_text.trim()) return payload.output_text.trim();
            return (Array.isArray(payload?.output) ? payload.output : [])
              .flatMap((item: any) => Array.isArray(item?.content) ? item.content : [])
              .filter((part: any) => part?.type === 'output_text')
              .map((part: any) => String(part?.text || ''))
              .join('')
              .trim();
          }

          export function isOpenAiFallbackConfigured(): boolean {
            return Boolean(String(process.env.OPENAI_API_KEY || '').trim());
          }

          export async function requestOpenAiFallback(input: {
            instructions?: string;
            messages: OpenAiFallbackMessage[];
            options?: OpenAiFallbackOptions;
          }): Promise<{ text: string; model: string }> {
            const apiKey = String(process.env.OPENAI_API_KEY || '').trim();
            if (!apiKey) throw new Error('OpenAI API key is not configured.');
            const model = String(input.options?.model || process.env.OPENAI_CHAT_MODEL || 'gpt-5.6-luna').trim();
            const response = await fetch('https://api.openai.com/v1/responses', {
              method: 'POST',
              headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
              signal: AbortSignal.timeout(120_000),
              body: JSON.stringify({
                model,
                store: false,
                instructions: String(input.instructions || ''),
                input: input.messages,
                max_output_tokens: Math.max(64, Math.min(4000, Number(input.options?.maxTokens || 900))),
              }),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`OpenAI request failed: ${String((payload as any)?.error?.message || `HTTP ${response.status}`).slice(0, 300)}`);
            const text = extractOutputText(payload);
            if (!text) throw new Error('OpenAI returned an empty response.');
            return { text, model };
          }

          export async function generateOpenAiFallbackResponse(
            prompt: string,
            systemPrompt?: string,
            options?: OpenAiFallbackOptions,
          ): Promise<string> {
            const result = await requestOpenAiFallback({
              instructions: systemPrompt,
              messages: [{ role: 'user', content: prompt }],
              options,
            });
            return result.text;
          }
          EOF
      - name: Patch shared and private routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/services/ai-provider.ts')
          s = p.read_text()
          imp = "import { isOpenAiFallbackConfigured, generateOpenAiFallbackResponse } from '@/services/openai-fallback';\n"
          marker = "import { isSpmtLocalLlmEnabled, requestSpmtLocalLlm } from '@/services/spmt-local-llm';\n"
          if imp not in s:
              if marker not in s: raise SystemExit('ai-provider import marker missing')
              s = s.replace(marker, marker + imp, 1)
          old = """  if (!isSpmtLocalLlmEnabled()) {
    throw new Error(`AI generation failed. EdenAI primary: ${edenFailure} Local Qwen fallback is disabled.`);
  }
"""
          new = """  let openAiFailure = '';
  if (isOpenAiFallbackConfigured()) {
    try {
      const response = await generateOpenAiFallbackResponse(prompt, governedPrompt(systemPrompt), options);
      console.log(`[AI Provider] OpenAI fallback served tenant ${tenantId || 'global'}`);
      return response;
    } catch (error) {
      openAiFailure = error instanceof Error ? error.message : String(error);
      console.warn(`[AI Provider] OpenAI fallback failed for tenant ${tenantId || 'global'}; trying local Qwen:`, openAiFailure);
    }
  }

  if (!isSpmtLocalLlmEnabled()) {
    throw new Error(`AI generation failed. EdenAI primary: ${edenFailure} OpenAI fallback: ${openAiFailure || 'not configured'} Local Qwen fallback is disabled.`);
  }
"""
          if old not in s: raise SystemExit('shared AI fallback marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/app/api/private-chat/respond/route.ts')
          s = p.read_text()
          imp = "import { isOpenAiFallbackConfigured, requestOpenAiFallback } from '@/services/openai-fallback';\n"
          marker = "import { generateEdenAIFallbackResponse } from '@/services/ai-provider';\n"
          if imp not in s:
              if marker not in s: raise SystemExit('private chat import marker missing')
              s = s.replace(marker, marker + imp, 1)
          s = s.replace("provider: 'edenai-primary' | 'self-hosted-qwen-adult';", "provider: 'edenai-primary' | 'self-hosted-qwen-adult' | 'openai-adult-bridge';", 1)
          start = s.index('  if (input.adultMode) {')
          end = s.index('\n\n  const edenSystem = [', start)
          block = '''  if (input.adultMode) {
    const preferQwen = process.env.PRIVATE_QWEN_PREFERRED === 'true';

    const tryOpenAi = async (): Promise<PrivateCompletionResult | null> => {
      if (!isOpenAiFallbackConfigured()) return null;
      try {
        const historyMessages = input.history.slice(-24).map((entry) => ({
          role: entry.type === 'ai' ? 'assistant' as const : 'user' as const,
          content: String(entry.message || '').trim(),
        })).filter((entry) => entry.content);
        const completion = await requestOpenAiFallback({
          instructions: input.systemPrompt,
          messages: [...historyMessages, { role: 'user', content: input.message }],
          options: { maxTokens: 900, model: process.env.PRIVATE_OPENAI_MODEL || process.env.OPENAI_CHAT_MODEL || 'gpt-5.6-luna' },
        });
        const text = sanitizeQwenReply({ text: completion.text, username: input.username, botName: input.botName, latestUserMessage: input.message }).trim();
        if (!text) throw new Error('OpenAI returned no usable private reply.');
        return { text, provider: 'openai-adult-bridge' };
      } catch (error) {
        console.warn('[Private Chat API] OpenAI Adult Mode bridge failed:', safeModelError(error instanceof Error ? error.message : String(error)));
        return null;
      }
    };

    if (!preferQwen) {
      const openAi = await tryOpenAi();
      if (openAi) return openAi;
    }

    const qwen = await requestQwenPrivateChatCompletion({
      baseUrl: input.baseUrl,
      model: input.model,
      apiKey: input.apiKey,
      systemPrompt: input.systemPrompt,
      username: input.username,
      botName: input.botName,
      message: input.message,
      history: input.history,
      memoryIndex: input.memoryIndex,
      memoryContext: input.memoryContext,
      adultMode: true,
    });

    if (!qwen.upstreamStatus && !qwen.upstreamError && qwen.text.trim()) {
      return { text: qwen.text.trim(), provider: 'self-hosted-qwen-adult' };
    }

    if (preferQwen) {
      const openAi = await tryOpenAi();
      if (openAi) return openAi;
    }

    const qwenError = safeModelError(qwen.upstreamError || (qwen.upstreamStatus ? `HTTP ${qwen.upstreamStatus}` : 'empty response'));
    return { text: '', provider: 'self-hosted-qwen-adult', error: `Adult Mode providers unavailable. Local Qwen: ${qwenError}` };
  }'''
          s = s[:start] + block + s[end:]
          s = s.replace(
            "`${botName} will use the owner-hosted SPMT Qwen model with the adult private-chat policy.`,\n            'EdenAI is not used while Adult Mode is on.',",
            "process.env.PRIVATE_QWEN_PREFERRED === 'true'\n              ? `${botName} will prefer local Qwen and use OpenAI only if Qwen is unavailable.`\n              : `${botName} will use the temporary OpenAI bridge while local Qwen is offline; Qwen remains available as fallback.`,\n            'EdenAI is not used while Adult Mode is on.',",
            1,
          )
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm run typecheck
          grep -q 'OpenAI fallback served' src/services/ai-provider.ts
          grep -q 'PRIVATE_QWEN_PREFERRED' src/app/api/private-chat/respond/route.ts
          grep -q 'gpt-5.6-luna' src/services/openai-fallback.ts
      - name: Commit
        run: |
          git config user.name "spmt-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/services/openai-fallback.ts src/services/ai-provider.ts src/app/api/private-chat/respond/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: use OpenAI as temporary Qwen fallback"
          git push origin HEAD:main
