name: Fix Discord Ingress Permissions

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Discord economy batch porter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch and validate Discord ingress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch -C fix/discord-ingress-public-permissions
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/app/api/discord/chat/route.ts')
          s = p.read_text()
          old = """    const dshAccess = await checkDiscordStreamHubAdminAccess({ guildId, userId });
    const effectiveIsAdmin = Boolean(normalized.isAdmin || dshAccess?.isAdmin);
    const effectiveIsMod = Boolean(normalized.isMod || dshAccess?.isMod);
    const effectiveIsOwner = Boolean(normalized.isOwner || dshAccess?.isOwner);
    const canManageBotShare = !permissionFieldsPresent || hasDiscordModAccess({
      isAdmin: effectiveIsAdmin,
      isMod: effectiveIsMod,
      isOwner: effectiveIsOwner,
      memberPermissions: permissions,
    });
"""
          new = """    const normalizedCommandName = message.trim().startsWith('!')
      ? message.trim().slice(1).split(/\\s+/)[0]?.toLowerCase() || ''
      : '';
    const ingressPrivilegedCommands = new Set([
      'admin', 'ignore', 'timeout', 'botshare',
      'addpoints', 'setpoints', 'addtoall', 'settoall', 'resetallpoints',
      'greetingmode', 'welcomemode', 'clipmode', 'chatmode', 'athenaeverywhere',
      'addflow', 'approveflow', 'disableflow', 'deleteflow',
    ]);
    const permanentOwnerIds = new Set([
      '767875979561009173',
      String(process.env.STREAMWEAVER_OWNER_DISCORD_ID || '').trim(),
      String(process.env.NEXT_PUBLIC_HARDCODED_ADMIN_DISCORD_ID || '').trim(),
    ].filter(Boolean));
    const isPermanentOwner = permanentOwnerIds.has(String(userId || '').trim());
    const shouldResolveDshAccess = ingressPrivilegedCommands.has(normalizedCommandName) && !isPermanentOwner;
    const dshAccess = shouldResolveDshAccess
      ? await checkDiscordStreamHubAdminAccess({ guildId, userId })
      : null;
    const effectiveIsAdmin = Boolean(normalized.isAdmin || isPermanentOwner || dshAccess?.isAdmin);
    const effectiveIsMod = Boolean(normalized.isMod || isPermanentOwner || dshAccess?.isMod);
    const effectiveIsOwner = Boolean(normalized.isOwner || isPermanentOwner || dshAccess?.isOwner);
    const canManageBotShare = !permissionFieldsPresent || hasDiscordModAccess({
      isAdmin: effectiveIsAdmin,
      isMod: effectiveIsMod,
      isOwner: effectiveIsOwner,
      memberPermissions: permissions,
    });
"""
          if old not in s:
              raise SystemExit('ingress permission block not found')
          s = s.replace(old, new, 1)
          old2 = """    if (!tenantId && !isPrivateDiscordLane && dshAccess?.isOwner) {
"""
          new2 = """    if (!tenantId && !isPrivateDiscordLane && effectiveIsOwner) {
"""
          if old2 not in s:
              raise SystemExit('owner tenant block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          Path('.github/workflows/run-discord-economy-porter.yml').unlink()
          PY
          npm ci
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/api/discord/chat/route.ts .github/workflows/run-discord-economy-porter.yml
          git commit -m "Fix Discord ingress permission routing"
          git push --force-with-lease origin fix/discord-ingress-public-permissions
