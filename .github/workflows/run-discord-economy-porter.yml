name: Fix Discord Role-Gated Ingress

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Discord economy batch porter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch role-gated Discord permissions
        run: |
          git switch -C fix/discord-role-gated-ingress
          python3 <<'PY'
          from pathlib import Path

          route = Path('src/app/api/discord/chat/route.ts')
          s = route.read_text()
          old = """    const dshAccess = await checkDiscordStreamHubAdminAccess({ guildId, userId });
    const effectiveIsAdmin = Boolean(normalized.isAdmin || dshAccess?.isAdmin);
    const effectiveIsMod = Boolean(normalized.isMod || dshAccess?.isMod);
    const effectiveIsOwner = Boolean(normalized.isOwner || dshAccess?.isOwner);
    const canManageBotShare = !permissionFieldsPresent || hasDiscordModAccess({
      isAdmin: effectiveIsAdmin,
      isMod: effectiveIsMod,
      isOwner: effectiveIsOwner,
      memberPermissions: permissions,
    });
"""
          new = """    const normalizedCommandName = message.trim().startsWith('!')
      ? message.trim().slice(1).split(/\\s+/)[0]?.toLowerCase() || ''
      : '';
    const ingressPrivilegedCommands = new Set([
      'admin', 'ignore', 'timeout', 'botshare',
      'addpoints', 'setpoints', 'addtoall', 'settoall', 'resetallpoints',
      'greetingmode', 'welcomemode', 'clipmode', 'chatmode', 'athenaeverywhere',
      'addflow', 'approveflow', 'disableflow', 'deleteflow',
    ]);
    const shouldResolveDshAccess = ingressPrivilegedCommands.has(normalizedCommandName);
    const dshAccess = shouldResolveDshAccess
      ? await checkDiscordStreamHubAdminAccess({ guildId, userId })
      : null;
    const effectiveIsAdmin = Boolean(normalized.isAdmin || dshAccess?.isAdmin);
    const effectiveIsMod = Boolean(normalized.isMod || dshAccess?.isMod);
    const effectiveIsOwner = Boolean(normalized.isOwner || dshAccess?.isOwner);
    const canManageBotShare = !permissionFieldsPresent || hasDiscordModAccess({
      isAdmin: effectiveIsAdmin,
      isMod: effectiveIsMod,
      isOwner: effectiveIsOwner,
      memberPermissions: permissions,
    });
"""
          if old not in s:
              raise SystemExit('ingress permission block not found')
          s = s.replace(old, new, 1)
          route.write_text(s)

          dispatcher = Path('src/services/chat-dispatcher.ts')
          d = dispatcher.read_text()
          old_owner = """const PERMANENT_APP_OWNER_DISCORD_IDS = new Set([
    '767875979561009173',
    String(process.env.STREAMWEAVER_OWNER_DISCORD_ID || '').trim(),
    String(process.env.NEXT_PUBLIC_HARDCODED_ADMIN_DISCORD_ID || '').trim(),
].filter(Boolean));

function isPermanentDiscordOwner(msg: any): boolean {
    const userId = String(msg.author?.id || msg.userId || msg.user_id || '').trim();
    return Boolean(userId && PERMANENT_APP_OWNER_DISCORD_IDS.has(userId));
}

"""
          d = d.replace(old_owner, '', 1)
          d = d.replace("""    // The application owner must never depend on a network permission lookup.
    if (isPermanentDiscordOwner(msg)) return true;
""", '', 1)
          d = d.replace("""        : (isPermanentDiscordOwner(msg) || hasDiscordModAccess(msg));
""", """        : hasDiscordModAccess(msg);
""", 1)
          dispatcher.write_text(d)

          Path('.github/workflows/run-discord-economy-porter.yml').unlink()
          PY
          npm ci
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/api/discord/chat/route.ts src/services/chat-dispatcher.ts .github/workflows/run-discord-economy-porter.yml
          git commit -m "Fix Discord role-gated ingress permissions"
          git push --force-with-lease origin fix/discord-role-gated-ingress
