name: Companion Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: companion
      - run: npm run package:companion-runtime
      - run: npm run smoke:companion-runtime
      - name: Require Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          COMPANION_SIGNING_ENDPOINT: ${{ vars.COMPANION_SIGNING_ENDPOINT }}
          COMPANION_SIGNING_ACCOUNT: ${{ vars.COMPANION_SIGNING_ACCOUNT }}
          COMPANION_CERTIFICATE_PROFILE: ${{ vars.COMPANION_CERTIFICATE_PROFILE }}
          COMPANION_PUBLISHER_NAME: ${{ vars.COMPANION_PUBLISHER_NAME }}
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "COMPANION_SIGNING_ENDPOINT",
            "COMPANION_SIGNING_ACCOUNT",
            "COMPANION_CERTIFICATE_PROFILE",
            "COMPANION_PUBLISHER_NAME"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Artifact Signing is not configured. Missing GitHub repository variables: $($missing -join ', ')"
          }
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: npm run dist:win
        working-directory: companion
        env:
          COMPANION_AZURE_SIGNING: "true"
          COMPANION_SIGNING_ENDPOINT: ${{ vars.COMPANION_SIGNING_ENDPOINT }}
          COMPANION_SIGNING_ACCOUNT: ${{ vars.COMPANION_SIGNING_ACCOUNT }}
          COMPANION_CERTIFICATE_PROFILE: ${{ vars.COMPANION_CERTIFICATE_PROFILE }}
          COMPANION_PUBLISHER_NAME: ${{ vars.COMPANION_PUBLISHER_NAME }}
      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          COMPANION_PUBLISHER_NAME: ${{ vars.COMPANION_PUBLISHER_NAME }}
        run: |
          $installer = Get-Item "dist/companion/SpaceMountain-Companion-Setup-*.exe"
          $application = Get-Item "dist/companion/win-unpacked/SpaceMountain Companion.exe"
          foreach ($artifact in @($installer, $application)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($artifact.Name) is not validly Authenticode signed: $($signature.Status) $($signature.StatusMessage)"
            }
            if (-not $signature.SignerCertificate.Subject.Contains("CN=$env:COMPANION_PUBLISHER_NAME")) {
              throw "$($artifact.Name) signer does not match $env:COMPANION_PUBLISHER_NAME"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$($artifact.Name) does not have an RFC3161 timestamp"
            }
          }
      - name: Write checksum
        shell: pwsh
        env:
          COMPANION_PUBLISHER_NAME: ${{ vars.COMPANION_PUBLISHER_NAME }}
        run: |
          $artifact = Get-Item "dist/companion/SpaceMountain-Companion-Setup-*.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content -LiteralPath "$($artifact.FullName).sha256"
          @{
            schemaVersion = 1
            installer = $artifact.Name
            sha256 = $hash
            publisher = $env:COMPANION_PUBLISHER_NAME
            signed = $true
            signedAt = (Get-Date).ToUniversalTime().ToString("o")
            sourceSha = "${{ github.sha }}"
          } | ConvertTo-Json | Set-Content -LiteralPath "dist/companion/companion-signature.json"
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          SpaceMountain Companion for Windows.

          Download the setup executable, run it, and launch SpaceMountain Companion from the Start menu or desktop shortcut.

          This installer is Authenticode signed. Installed builds check this GitHub release channel
          for signed updates and ask before restarting to install one.
          "@
          gh release create $tag `
            "dist/companion/SpaceMountain-Companion-Setup-*.exe" `
            "dist/companion/SpaceMountain-Companion-Setup-*.exe.blockmap" `
            "dist/companion/SpaceMountain-Companion-Setup-*.exe.sha256" `
            "dist/companion/latest.yml" `
            "dist/companion/companion-signature.json" `
            --title "SpaceMountain Companion $tag" `
            --notes $notes `
            --verify-tag
