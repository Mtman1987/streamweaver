name: Companion Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: companion
      - run: npm run package:companion-runtime
      - run: npm run smoke:companion-runtime
      - run: npm run dist:win
        working-directory: companion
      - name: Write checksum
        shell: pwsh
        run: |
          $artifact = Get-Item "dist/companion/SpaceMountain-Companion-Setup-*.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content -LiteralPath "$($artifact.FullName).sha256"
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          SpaceMountain Companion for Windows.

          Download the setup executable, run it, and launch SpaceMountain Companion from the Start menu or desktop shortcut.

          This first public build is not code-signed, so Windows may show an Unknown publisher warning.
          "@
          gh release create $tag `
            "dist/companion/SpaceMountain-Companion-Setup-*.exe" `
            "dist/companion/SpaceMountain-Companion-Setup-*.exe.sha256" `
            --title "SpaceMountain Companion $tag" `
            --notes $notes `
            --verify-tag
