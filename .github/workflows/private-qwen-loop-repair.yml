name: Private Qwen Loop Repair

on:
  push:
    branches:
      - fix/private-qwen-repetition-loop-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply repetition repair
        run: python3 scripts/ci-repair-qwen-loop.py
      - name: Align stale regression tests with current contracts
        run: python3 scripts/ci-fix-full-validation.py
      - name: Focused Qwen tests
        run: node --import tsx --test tests/private-chat-qwen-mode.test.ts tests/personality-prompt.test.ts tests/bot-personality-defaults.test.ts
      - name: Full repository tests and persistence verification
        run: npm run test:isolation
      - name: Flow package verification
        run: npm run flow-packages:verify
      - name: Flow package smoke test
        run: npm run flow-packages:smoke
      - name: Companion check
        run: npm run companion:check
      - name: Production build
        run: npm run build
      - name: Commit repair after validation passes
        if: success()
        run: |
          if git diff --quiet; then
            echo "Repair already committed; validation-only run complete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/qwen-private-chat.ts tests/private-chat-qwen-mode.test.ts tests/discord-points-commands.test.ts tests/discord-structured-replies.test.ts tests/mt-support-report.test.ts tests/private-image-carousel.test.ts tests/signed-session.test.ts
          git commit -m "Fix private Qwen loop and align current regression contracts"
          git push origin HEAD:fix/private-qwen-repetition-loop-v2
