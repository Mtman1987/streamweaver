name: TTS readiness
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Fly Deploy]
    types: [completed]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Install audio decoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify free-only synthesis and decoded audio
        shell: bash
        run: |
          set -euo pipefail
          # Fixed sample only; no private conversations or credentials are logged.
          flyctl ssh console --app streamweaver-new --command 'node --import tsx -e '\''const {generateTTS,getTTSConfig}=require("./src/services/tts-provider.ts");
          (async()=>{
           const {readAICostPolicy}=require("./src/services/ai-cost-policy.ts");
           if(readAICostPolicy().paidRoutesEnabled) throw new Error("Paid routes must stay paused");
           const config=getTTSConfig("94371378");
           if(!config.voice.startsWith("kokoro:")) throw new Error("Expected free trial voice");
           const originalFetch=globalThis.fetch;
           globalThis.fetch=async(...args)=>{
            if(new URL(String(args[0])).hostname!=="127.0.0.1") throw new Error("Non-trial AI route blocked by readiness check");
            return originalFetch(...args);
           };
           const audio=await generateTTS("This is a free voice check.",undefined,"94371378");
           if(!audio.startsWith("data:audio/wav;base64,")) throw new Error("Expected WAV audio");
           console.log("TRIAL_AUDIO:"+audio.slice("data:audio/wav;base64,".length));
          })().catch(()=>{console.error("Free speech check failed");process.exitCode=1});'\''' | python3 -c 'import sys,base64; line=next((s.strip() for s in sys.stdin if s.startswith("TRIAL_AUDIO:")), ""); assert line, "No trial audio returned"; sys.stdout.buffer.write(base64.b64decode(line.split(":",1)[1],validate=True))' > "$RUNNER_TEMP/trial.wav"
          ffmpeg -v error -i "$RUNNER_TEMP/trial.wav" -ac 1 -ar 16000 -f s16le "$RUNNER_TEMP/trial.pcm"
          python3 - "$RUNNER_TEMP/trial.pcm" <<'PY'
          import array, json, math, sys
          samples = array.array("h")
          with open(sys.argv[1], "rb") as source:
              samples.frombytes(source.read())
          assert len(samples) > 1600, "Trial audio is too short"
          rms = math.sqrt(sum((s / 32768) ** 2 for s in samples) / len(samples))
          assert rms > 0.001, "Trial audio is silent"
          print(json.dumps({"voice": "kokoro-free-trial", "seconds": round(len(samples) / 16000, 2), "rms": round(rms, 4), "decoded": True}))
          PY
