name: TTS readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/tts-readiness.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Inspect stored Fly speech secret names and deployment status
        shell: bash
        run: |
          set -euo pipefail
          flyctl secrets list --app streamweaver-new
      - name: Check the StreamWeaver main app name
        continue-on-error: true
        shell: bash
        run: flyctl secrets list --app streamweaver-main
      - name: Compare saved and effective public voice IDs
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app streamweaver-new --command 'node --import tsx -e "const {getBotVoice}=require(\"./src/lib/bot-settings-store.ts\");const {getTTSConfig}=require(\"./src/services/tts-provider.ts\");const {getTtsVoiceOption}=require(\"./src/lib/tts-voices.ts\");const tenantId=\"94371378\";const saved=getTtsVoiceOption(getBotVoice(tenantId));const effective=getTTSConfig(tenantId);console.log(JSON.stringify({savedVoice:saved.id,savedProvider:saved.provider,effectiveVoice:effective.voice,effectiveProvider:effective.provider,edenaiConfigured:Boolean(effective.apiKey),deepgramConfigured:Boolean(effective.deepgramApiKey)}))"'
      - name: Test exact Athena voice through existing Eden AI
        shell: bash
        run: |
          flyctl ssh console --app streamweaver-new --command 'node --import tsx -e '\''const {getTTSConfig}=require("./src/services/tts-provider.ts");
          const {getTtsVoiceOption,normalizeTtsProvider}=require("./src/lib/tts-voices.ts");
          (async()=>{
           const config=getTTSConfig("94371378");
           console.log(JSON.stringify({configuredDefaultVoice:getTtsVoiceOption(process.env.NEXT_DEFAULT_TTS_VOICE).id,configuredProvider:normalizeTtsProvider(process.env.TTS_PROVIDER)}));
           if(!config.apiKey) throw new Error("Eden AI is not configured");
           const response=await fetch("https://api.edenai.run/v2/audio/text_to_speech",{
            method:"POST",headers:{Authorization:"Bearer "+config.apiKey,"Content-Type":"application/json"},
            body:JSON.stringify({providers:"deepgram",language:"en",text:"This is an Athena voice check.",option:"FEMALE",audio_format:"mp3",settings:{deepgram:"aura-2-athena-en"},response_as_dict:true}),
            signal:AbortSignal.timeout(30000)
           });
           const result=await response.json().catch(()=>({}));
           const provider=result.deepgram;
           const message=JSON.stringify(provider?.error||result.error||result.detail||(!response.ok?result:{})).replaceAll(config.apiKey,"[redacted]");
           console.log(JSON.stringify({httpStatus:response.status,providerStatus:provider?.status||null,hasAudio:Boolean(provider?.audio_resource_url||provider?.audio),failure:provider?.audio_resource_url||provider?.audio?null:message.slice(0,1500)}));
           if(provider?.audio_resource_url){
            const audio=await fetch(provider.audio_resource_url,{signal:AbortSignal.timeout(30000)});
            const bytes=(await audio.arrayBuffer()).byteLength;
            console.log(JSON.stringify({audioStatus:audio.status,audioType:audio.headers.get("content-type"),audioBytes:bytes}));
           }
          })().catch(()=>{console.error("Athena Eden AI probe failed before completion");process.exitCode=1});'\'''
