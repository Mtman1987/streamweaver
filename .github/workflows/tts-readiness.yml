name: TTS readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/tts-readiness.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Report existing speech configuration without credential values
        shell: bash
        run: |
          set -euo pipefail
          for app in streamweaver-new hearmeout-main hmo-dj-worker; do
            echo "Speech configuration: $app"
            flyctl ssh console --app "$app" --command 'node -e "const keys=[\"DEEPGRAM_API_KEY\",\"EDENAI_API_KEY\",\"LIVEKIT_API_KEY\",\"LIVEKIT_API_SECRET\",\"LIVEKIT_URL\",\"NEXT_PUBLIC_LIVEKIT_URL\"];console.log(JSON.stringify({app:process.env.FLY_APP_NAME,configured:Object.fromEntries(keys.map(k=>[k,Boolean(process.env[k]?.trim())]))}))"' || true
          done
