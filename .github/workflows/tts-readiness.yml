name: TTS readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/tts-readiness.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Compare saved and effective public voice IDs
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app streamweaver-new --command 'node --import tsx -e "const {getBotVoice}=require(\"./src/lib/bot-settings-store.ts\");const {getTTSConfig}=require(\"./src/services/tts-provider.ts\");const {getTtsVoiceOption}=require(\"./src/lib/tts-voices.ts\");const tenantId=\"94371378\";const saved=getTtsVoiceOption(getBotVoice(tenantId));const effective=getTTSConfig(tenantId);console.log(JSON.stringify({savedVoice:saved.id,savedProvider:saved.provider,effectiveVoice:effective.voice,effectiveProvider:effective.provider,edenaiConfigured:Boolean(effective.apiKey),deepgramConfigured:Boolean(effective.deepgramApiKey)}))"'
