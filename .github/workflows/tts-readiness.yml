name: TTS readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/tts-readiness.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Inspect stored Fly speech secret names and deployment status
        shell: bash
        run: |
          set -euo pipefail
          flyctl secrets list --app streamweaver-new
      - name: Check the StreamWeaver main app name
        continue-on-error: true
        shell: bash
        run: flyctl secrets list --app streamweaver-main
      - name: Compare saved and effective public voice IDs
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app streamweaver-new --command 'node --import tsx -e "const {getBotVoice}=require(\"./src/lib/bot-settings-store.ts\");const {getTTSConfig}=require(\"./src/services/tts-provider.ts\");const {getTtsVoiceOption}=require(\"./src/lib/tts-voices.ts\");const tenantId=\"94371378\";const saved=getTtsVoiceOption(getBotVoice(tenantId));const effective=getTTSConfig(tenantId);console.log(JSON.stringify({savedVoice:saved.id,savedProvider:saved.provider,effectiveVoice:effective.voice,effectiveProvider:effective.provider,edenaiConfigured:Boolean(effective.apiKey),deepgramConfigured:Boolean(effective.deepgramApiKey)}))"'
      - name: Test exact Athena voice through Eden AI Aura-2
        shell: bash
        run: |
          flyctl ssh console --app streamweaver-new --command 'node --import tsx -e '\''const {getTTSConfig}=require("./src/services/tts-provider.ts");
          (async()=>{
           const config=getTTSConfig("94371378");
           if(!config.apiKey) throw new Error("Eden AI is not configured");
           for(const voice of ["aura-2-athena-en","athena"]){
            const response=await fetch("https://api.edenai.run/v3/universal-ai",{
             method:"POST",headers:{Authorization:"Bearer "+config.apiKey,"Content-Type":"application/json"},
             body:JSON.stringify({model:"audio/tts/deepgram/aura-2",input:{voice,text:"This is an Athena voice check.",audio_format:"mp3"}}),
             signal:AbortSignal.timeout(30000)
            });
            const result=await response.json().catch(()=>({}));
            const output=result.output;
            const message=JSON.stringify(result.error||result.detail||(!response.ok?result:{})).replaceAll(config.apiKey,"[redacted]");
            console.log(JSON.stringify({requestedVoice:voice,httpStatus:response.status,provider:result.provider||null,providerStatus:result.status||null,hasAudio:Boolean(output?.audio_resource_url),failure:output?.audio_resource_url?null:message.slice(0,1500)}));
            if(output?.audio_resource_url){
             const audio=await fetch(output.audio_resource_url,{signal:AbortSignal.timeout(30000)});
             const bytes=Buffer.from(await audio.arrayBuffer());
             const {spawnSync}=require("node:child_process");
             const decoded=spawnSync("ffmpeg",["-v","error","-i","pipe:0","-f","null","-"],{input:bytes});
             console.log(JSON.stringify({audioStatus:audio.status,audioType:audio.headers.get("content-type"),audioBytes:bytes.length,decodeStatus:decoded.status}));
             break;
            }
           }
          })().catch(()=>{console.error("Athena Eden AI probe failed before completion");process.exitCode=1});'\'''
