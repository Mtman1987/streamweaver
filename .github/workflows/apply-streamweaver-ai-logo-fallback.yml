name: Apply StreamWeaver AI logo fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-streamweaver-ai-logo-fallback.yml
      - scripts/apply-streamweaver-ai-logo-fallback.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply fallback
        run: python3 scripts/apply-streamweaver-ai-logo-fallback.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Structured reply tests
        run: npm run test -- --runInBand tests/discord-structured-replies.test.ts
      - name: Commit production changes
        run: |
          rm -f scripts/apply-streamweaver-ai-logo-fallback.py
          rm -f .github/workflows/apply-streamweaver-ai-logo-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use StreamWeaver logo when an AI has no saved avatar"
          git push origin main
