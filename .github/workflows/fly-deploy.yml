# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  branch-housekeeping:
    name: Retain newest merged branch backup
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete older branches already contained in main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const merged = [];
            for (const branch of branches) {
              if (!branch?.name || branch.name === defaultBranch) continue;
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: branch.name, head: defaultBranch,
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                core.notice(`Retaining unmerged branch ${branch.name}.`);
                continue;
              }
              const commit = await github.rest.repos.getCommit({ owner, repo, ref: branch.commit.sha });
              const date = commit.data.commit.committer?.date || commit.data.commit.author?.date || '1970-01-01T00:00:00Z';
              merged.push({ name: branch.name, sha: branch.commit.sha, date });
            }
            merged.sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
            const newest = merged[0];
            if (newest) core.notice(`Keeping newest merged branch backup ${newest.name} (${newest.sha}).`);
            for (const branch of merged.slice(1)) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
                core.notice(`Deleted older merged branch ${branch.name}.`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.warning(`Could not delete ${branch.name}; it may be protected or already absent.`);
                  continue;
                }
                throw error;
              }
            }
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-group
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies for command smoke
        run: npm ci --ignore-scripts
      - name: Verify replay corruption recovery and concurrent ingestion
        run: node --import tsx --test tests/shared-chat-recovery.test.ts tests/shared-chat-ingestion.test.ts
      - name: Verify free AI cost policy
        run: node --import tsx --test tests/free-ai-policy.test.ts && node --test tests/free-voice-entrypoint.test.mjs
      - name: Run live command smoke tests
        run: node --import tsx --test tests/spmt-command-aliases.test.ts tests/stella-lounge-replies.test.ts tests/root-command-runtime-coverage.test.ts tests/bot-action-runtime.test.ts
      - name: Verify Chat Tag check-in bridge
        run: node --import tsx --test tests/chat-tag-checkin-bridge.test.cjs tests/checkin-shoutout.test.cjs tests/operational-error-recovery.test.cjs tests/twitch-token-recovery.test.ts
      - name: Check Spotlight commercial overlay
        run: node --test tests/spotlight-commercial-break.test.cjs
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy app from GitHub runner
        run: flyctl deploy --local-only --no-cache --lease-timeout 2m --deploy-retries 3 --build-arg BUILD_SHA=${{ github.sha }} --build-arg GITHUB_SHA=${{ github.sha }} --build-arg GH_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NO_COLOR: "1"

      - name: Verify existing shared CPU limit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machines list --app streamweaver-new --json > "$RUNNER_TEMP/voice-host.json"
          python3 - "$RUNNER_TEMP/voice-host.json" <<'PYCPU'
          import json, sys
          machines = json.load(open(sys.argv[1]))
          assert len(machines) == 1, "Voice trial must share one existing machine"
          guest = machines[0]["config"]["guest"]
          assert guest["cpu_kind"] == "shared" and guest["cpus"] <= 4, "Voice host exceeds shared CPU cap"
          print("Free voice shares one existing machine with at most four shared CPUs")
          PYCPU
      - name: Verify real free speech on the existing host
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app streamweaver-new --command '/opt/kokoro-venv/bin/python /app/workers/free-tts/smoke.py'
