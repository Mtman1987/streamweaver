# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-group
      # Do not kill an active Fly build when another main push arrives.
      # Deployments queue and run in order instead of leaving the app mid-build.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies for command smoke
        run: npm ci --ignore-scripts
      # Deploy directly after dependency installation; targeted regression suites are run on demand, not on every production push.
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Sync StreamElements secrets
        run: |
          if [ -n "$STREAMELEMENTS_JWT_TOKEN" ] && [ -n "$STREAMELEMENTS_ACCOUNT_ID" ]; then
            flyctl secrets set \
              STREAMELEMENTS_ACCOUNT_ID="$STREAMELEMENTS_ACCOUNT_ID" \
              STREAMELEMENTS_JWT_TOKEN="$STREAMELEMENTS_JWT_TOKEN" \
              STREAMELEMENTS_CLIENT_ID="$STREAMELEMENTS_CLIENT_ID" \
              STREAMELEMENTS_CLIENT_SECRET="$STREAMELEMENTS_CLIENT_SECRET" \
              STREAMELEMENTS_REDIRECT_URI="$STREAMELEMENTS_REDIRECT_URI" \
              --app streamweaver-new
          else
            echo "StreamElements secrets not configured; skipping secret sync."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STREAMELEMENTS_CLIENT_ID: ${{ secrets.STREAMELEMENTS_CLIENT_ID }}
          STREAMELEMENTS_CLIENT_SECRET: ${{ secrets.STREAMELEMENTS_CLIENT_SECRET }}
          STREAMELEMENTS_REDIRECT_URI: ${{ secrets.STREAMELEMENTS_REDIRECT_URI }}
          STREAMELEMENTS_ACCOUNT_ID: ${{ secrets.STREAMELEMENTS_ACCOUNT_ID }}
          STREAMELEMENTS_JWT_TOKEN: ${{ secrets.STREAMELEMENTS_JWT_TOKEN }}
      - name: Deploy app from GitHub runner
        run: flyctl deploy --local-only --no-cache --lease-timeout 2m --deploy-retries 3 --build-arg BUILD_SHA=${{ github.sha }} --build-arg GITHUB_SHA=${{ github.sha }} --build-arg GH_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NO_COLOR: "1"

      - name: Verify existing shared CPU limit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machines list --app streamweaver-new --json > "$RUNNER_TEMP/voice-host.json"
          python3 - "$RUNNER_TEMP/voice-host.json" <<'PYCPU'
          import json, sys
          machines = json.load(open(sys.argv[1]))
          assert len(machines) == 1, "Voice trial must share one existing machine"
          guest = machines[0]["config"]["guest"]
          assert guest["cpu_kind"] == "shared" and guest["cpus"] <= 4, "Voice host exceeds shared CPU cap"
          print("Free voice shares one existing machine with at most four shared CPUs")
          PYCPU
      - name: Verify real free speech on the existing host
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app streamweaver-new --command '/opt/kokoro-venv/bin/python /app/workers/free-tts/smoke.py'
