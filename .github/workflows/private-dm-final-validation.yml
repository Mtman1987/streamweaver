name: Private DM Final Validation

on:
  push:
    branches:
      - fix/private-dm-ltm-repeat-boundary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Exact production repetition regression
        run: node --import tsx --test tests/private-chat-response-guard.test.ts tests/private-chat-qwen-mode.test.ts
      - name: Full repository tests and persistence verification
        run: npm run test:isolation
      - name: Flow package verification
        run: npm run flow-packages:verify
      - name: Flow package smoke test
        run: npm run flow-packages:smoke
      - name: Companion check
        run: npm run companion:check
      - name: Production build
        run: npm run build:simple
