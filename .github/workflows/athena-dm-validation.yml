name: Athena DM Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-athena-dm-commands:
    name: Test Athena private Qwen routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run open-command tests
        run: node --import tsx --test tests/open-bot-commands.test.ts tests/open-bot-bang-command-routing.test.ts
      - name: Run private Qwen, personality, media, emoji-control, and TTS privacy tests
        run: node --import tsx --test tests/private-chat-qwen-mode.test.ts tests/personality-prompt.test.ts tests/bot-personality-defaults.test.ts tests/private-dm-controls.test.ts tests/private-dm-tts-privacy.test.ts tests/private-image-carousel.test.ts tests/discord-media-and-images.test.ts
      - name: Typecheck
        run: npm run typecheck
