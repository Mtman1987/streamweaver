name: Shared Bot Runtime Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shared-bot-runtime:
    name: Test shared bot runtime and private Qwen routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply and test The Count Easter egg integration
        run: node scripts/patch-the-count-easter-egg.mjs && node --import tsx --test tests/the-count-easter-egg.test.ts
      - name: Apply and test final Signal integration
        run: node scripts/patch-signal-system.mjs && node --import tsx --test tests/signal-system.test.ts
      - name: Run shared command and AI-provider tests
        run: node --import tsx --test tests/open-bot-commands.test.ts tests/open-bot-bang-command-routing.test.ts tests/shared-bot-runtime-local-llm.test.ts tests/shared-ai-provider-routing.test.ts tests/admin-bot-fleet.test.ts tests/cloudflare-image-settings.test.ts
      - name: Run shared workspace shell regression
        run: node --import tsx --test tests/spmt-workspace-shell.test.ts tests/internal-known-bots-contract.test.ts tests/companion-tenant-bootstrap-contract.test.mjs
      - name: Run private Qwen, personality, media, emoji-control, TTS, gallery, and model tests
        run: node --import tsx --test tests/private-chat-qwen-mode.test.ts tests/private-chat-response-guard.test.ts tests/qwen-quality.test.ts tests/qwen-recovery-fallback.test.ts tests/private-chat-model-selection.test.ts tests/personality-prompt.test.ts tests/bot-personality-defaults.test.ts tests/bot-fallback-identity.test.ts tests/private-dm-controls.test.ts tests/private-dm-tts-privacy.test.ts tests/private-dm-live-tts.test.ts tests/private-dm-live-tts-page.test.ts tests/private-dm-live-tts-toggle-contract.test.ts tests/private-image-carousel.test.ts tests/private-image-library.test.ts tests/private-image-library-route.test.ts tests/private-gallery-navigation.test.ts tests/discord-media-and-images.test.ts
      - name: Typecheck
        run: npm run typecheck
